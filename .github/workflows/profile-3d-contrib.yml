name: GitHub Contribution Art

on:
  schedule:
    - cron: "0 0 * * *" # runs once a day
  workflow_dispatch: # lets you trigger it manually from the Actions tab
  push:
    branches:
      - main

jobs:
  generate-snake:
    runs-on: ubuntu-latest
    steps:
      - name: Generate contribution snake
        uses: Platane/snk@v3
        with:
          github_user_name: Amber-Tahreem
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark
      - name: Push snake output to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  generate-3d-calendar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Generate 3D contribution calendar
        uses: yoshi389111/github-profile-3d-contrib@0.7.1
        env:
          GITHUB_USER_NAME: Amber-Tahreem
        with:
          username: Amber-Tahreem
      - name: Commit 3D calendar SVGs
        run: |
          git config --local user.email "actions@github.com"
          git config --local user.name "GitHub Actions"
          git add -f profile-3d-contrib/*.svg
          git commit -m "Generate 3D contribution calendar" || echo "No changes to commit"
          git push
